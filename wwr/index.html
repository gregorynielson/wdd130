<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page | Midwest Rafting Company</title>
    <meta name="description"
        content="This page contains some information about the company and the types of experiences they offer.">
    <meta name="author" content="Greg Nielson">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.webp" alt="Rafting Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>


        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/home-page-hero.webp" alt="River raft group in rapids">
            <h1>Midwest Rafting Company</h1>
            <a href="trips.html" class="button">Book A Trip!</a>
        </div>
        <section class="newsletter">
            <h2>Sign Up for Our Weekly Newsletter</h2>
            <form>
                <div class="name">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter name">
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email">
                </div>
                <button type="submit">Sign Up!</button>
            </form>
        </section>
        <section class="options">
            <h2>A Full Outdoor Experience</h2>
            <figure>
                <img src="images/rafting4_600.webp" alt="team rafting on rapids">
                <figcaption>Rafting</figcaption>
            </figure>
            <figure>
                <img src="images/camping.webp" alt="tent in campsite">
                <figcaption>Camping</figcaption>
            </figure>
            <figure>
                <img src="images/fishing.webp" alt="man fishing in lake">
                <figcaption>Fishing</figcaption>
            </figure>
            <figure>
                <img src="images/hiking.webp" alt="woman hiking in trail">
                <figcaption>Hiking</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 | Midwest Rafting Company | Greg Nielson</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.webp" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.webp" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-bw.webp" alt="Youtube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
