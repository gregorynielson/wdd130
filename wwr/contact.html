<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Midwest Rafting Company</title>
    <meta name="description" content="This page includes contact details and a form for users to ask questions.">
    <meta name="author" content="Greg Nielson">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.webp" alt="Rafting Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>


        </nav>
    </header>
    <main>
        <section class="info">
            <div>
                <h1>Midwest Rafting Company</h1>
                <p>12345 White River Rd</p>
                <p>Traverse City, MI</p>
                <p>555-555-1234</p>
                <p>whitewater@rafting.com</p>
            </div>
        </section>
        <section class="map-form">
            <div>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11331.626301322285!2d-85.63749871237168!3d44.762320023294386!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1765049513040!5m2!1sen!2sus"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="name">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Name">
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email">
                </div>
                <div class="radio">
                    <input type="radio" id="general" name="purpose">
                    <label for="general">General Inquiry</label>
                </div>
                <div class="radio">
                    <input type="radio" id="reservation" name="purpose">
                    <label for="reservation">Reservation Question</label>
                </div>
                <div class="radio">
                    <input type="radio" id="suggestion" name="purpose">
                    <label for="suggestion">Webstie Suggestion</label>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" rows="3"></textarea>
                </div>
                <div>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>
                <div>
                    <button type="submit">Send My Message</button>
                </div>
            </form>
        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/raftwoman.webp" alt="The owner of the company">
                <figcaption>Company Owner</figcaption>
            </figure>
            <figure>
                <img src="images/raftman.webp" alt="Director of Operations">
                <figcaption>Director of Operations</figcaption>
            </figure>
            <figure>
                <img src="images/raftteam.webp" alt="Team members on a raft">
                <figcaption>Lead River Guides</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 | Midwest Rafting Company | Greg Nielson</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.webp" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.webp" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-bw.webp" alt="Youtube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
